name: Upload .NET package

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets NuGet/login trade the job's GitHub OIDC token for a short-lived nuget.org API key.
      id-token: write
    env:
      version: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and pack
        run: |
          echo $version
          echo ${version:1}
          case $version in v*) true;; *) echo "Git tag must start with a 'v'"; false;; esac
          export version=${version:1}
          echo $version
          dotnet build /p:VersionPrefix=$version --configuration Release Trell
          dotnet pack /p:VersionPrefix=$version --configuration Release Trell
      # Trusted publishing: nuget.org has a policy that trusts this workflow file in this
      # repository, so no long-lived API key is stored here. The key this step returns is
      # valid for one hour.
      # https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: Get a short-lived NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package to nuget
        run: dotnet nuget push Trell/bin/Release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
